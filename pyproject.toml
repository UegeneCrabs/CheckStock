[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [".venv", "data", "secrets"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"app/web/routers/stock_mutations.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = [
    "app/application/fbo_stock.py", "app/dto/fbo_stock.py",
    "app/infrastructure/fbo_stock_repository.py", "app/infrastructure/fbo_stock_orm.py",
