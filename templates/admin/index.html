<link rel="stylesheet" href="/static/admin/index.css">
<section class="ad-page" id="admin-page">
    <h1>Сотрудники и журнал</h1>
    <p>Сотрудников: $users_total · Активных: $users_active</p>
    <p id="admin-message" role="status" aria-live="polite"></p>
    <section class="panel">
        <h2>Добавить сотрудника</h2>
        <form id="create-user-form" class="admin-form">
            <label>ФИО <input name="full_name" required maxlength="200" autocomplete="name"></label>
            <label>Электронная почта <input name="google_email" type="email" required maxlength="320" autocomplete="email"></label>
            <label>Логин <input name="login" required maxlength="100" pattern="[A-Za-z0-9_.@+\-]+" autocomplete="off"></label>
            <label>Пароль <input name="password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password"></label>
            <button type="submit">Создать</button>
        </form>
    </section>
    <section class="panel">
        <h2>Сотрудники</h2>
        <label>Поиск <input id="user-search" type="search" placeholder="ФИО, логин или почта"></label>
        <div class="table-scroll"><table><thead><tr><th>ФИО</th><th>Логин</th><th>Почта</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="user-rows">$user_rows</tbody></table></div>
    </section>
    <section class="panel">
        <h2>Журнал действий</h2>
        <div class="table-scroll"><table><thead><tr><th>Когда</th><th>Сотрудник</th><th>Действие</th><th>Подробности</th><th>Файл</th></tr></thead><tbody>$log_rows</tbody></table></div>
    </section>
    <dialog id="password-dialog">
        <form id="password-form">
            <h2>Сменить пароль</h2><p>Действующие сессии сотрудника будут завершены.</p>
            <label>Новый пароль <input name="password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password"></label>
            <button type="submit">Сохранить</button><button type="button" id="password-cancel">Отмена</button>
        </form>
    </dialog>
</section>
<script src="/static/admin/index.js" defer></script>
