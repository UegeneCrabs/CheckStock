<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAKETA — Вход</title>
    <link rel="stylesheet" href="/static/style.css?v=53">
</head>
<body class="login-body">
    <main class="login-main">
        <form class="login-card" method="post" action="/login">
            <div class="login-logo">PAKE<span class="accent">TA</span></div>
            <p class="login-subtitle">Снабжение и остатки</p>

            $error

            <label class="login-field">
                <span>Логин</span>
                <input type="text" name="login" autocomplete="username" autofocus required>
            </label>

            <label class="login-field">
                <span>Пароль</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>

            <button class="btn-primary" type="submit">Войти</button>
        </form>
    </main>
</body>
</html>
