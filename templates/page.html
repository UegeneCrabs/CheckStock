<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>$title</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('checkstock-theme');
                if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css?v=62">
<link rel="stylesheet" href="/static/skladno-theme.css?v=39">
    <link rel="stylesheet" href="/static/decision-center.css?v=2">
    <link rel="stylesheet" href="/static/rnp-dashboard.css?v=1">
    <link rel="stylesheet" href="/static/stock-randomizer.css?v=2">
    <link rel="stylesheet" href="/static/ui-preferences.css?v=7">
    <link rel="stylesheet" href="/static/app-header.css?v=3">
    <link rel="stylesheet" href="/static/identifier-copy.css?v=1">


    <script src="/static/stock-rows.js?v=6"></script>
</head>
<body data-section="$section" data-access-level="$access_level">
    <div class="app-shell">
$header
        <div class="workspace">
            <main class="content $content_class">
$content
            </main>
        </div>
    </div>
    <script src="/static/identifier-copy.js?v=1"></script>
    <script src="/static/modal.js?v=2"></script>
    <script src="/static/collapse.js?v=1"></script>
    <script src="/static/select.js?v=1"></script>

    <script src="/static/stock-transit.js?v=2"></script>
<script src="/static/sales-dashboard.js?v=13"></script>
    <script src="/static/decision-center.js?v=3"></script>
    <script src="/static/rnp-dashboard.js?v=4"></script>
    <script src="/static/stock-randomizer.js?v=2"></script>
    <script src="/static/system-alerts.js?v=1"></script>
    <script src="/static/navigation.js?v=8"></script>
    <script src="/static/activity-tracker.js?v=1"></script>
</body>
</html>
