        <h2>Остатки</h2>
        <p class="page-subtitle">Сводка по кабинетам, маркетплейсам и текущему запасу</p>

$stock_summary

        <div class="sync-panel stock-sync-panel" id="sync-products-panel">
            <div class="stock-sync-main">
                <span class="stock-sync-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3"></path><path d="M4 4v5h5"></path><path d="M4 13a8 8 0 0 0 14.9 3"></path><path d="M20 20v-5h-5"></path></svg>
                </span>
                <span class="stock-sync-copy">
                    <strong>Обновление остатков</strong>
                    <small>Обновляет каталоги и текущие остатки WB, Ozon и Яндекс Маркета</small>
                </span>
            </div>

            <div class="stock-sync-actions">
            <p class="sync-last">
                <svg class="sync-last-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <polyline points="12 7 12 12 15 14"></polyline>
                </svg>
                <span>Последняя выгрузка:</span>
                <strong id="sync-products-last">$last_sync</strong>
            </p>
$sync_products_button
            </div>

            <span class="sync-status" id="sync-products-status" role="status" aria-live="polite"></span>

            <div class="sync-results" id="sync-products-results" aria-label="Результаты синхронизации"></div>
        </div>

        <div class="store-grid stock-store-grid">
$store_cards
        </div>

        <script>

            (function () {
                try {
                    var storage = window.sessionStorage;
                    for (var i = storage.length - 1; i >= 0; i--) {
                        var key = storage.key(i);
                        if (key && key.indexOf('paketa.access.') === 0) storage.removeItem(key);
                    }
                } catch (e) {

                }
            })();

            (function () {
                var panel = document.getElementById('sync-products-panel');
                var btn = document.getElementById('sync-products-btn');
                var status = document.getElementById('sync-products-status');
                var results = document.getElementById('sync-products-results');
                var lastSync = document.getElementById('sync-products-last');
                if (!btn) return;

                var AUTO_HIDE_MS = 60000;
                var hideTimer = null;

                function escapeHtml(value) {
                    return String(value == null ? '' : value)
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#39;');
                }

                function badge(label, state, text) {
                    var suffix = text === undefined || text === null || text === ''
                        ? ''
                        : ': ' + escapeHtml(text);
                    return '<span class="sync-badge sync-badge--' + state + '">'
                        + escapeHtml(label) + suffix + '</span>';
                }

                function renderEndpoint(label, entry) {
                    if (!entry) return badge(label, 'muted', '—');
                    if (entry.ok) return badge(label, 'ok', String(entry.count));
                    return badge(label, 'error', entry.error || 'ошибка');
                }


                function mpBlock(title, hasToken, body) {
                    if (!hasToken) {
                        return '<div class="sync-mp sync-mp--off">'
                            + '<div class="sync-mp-title">' + title + '</div>'
                            + badge('нет токена', 'muted', '')
                            + '</div>';
                    }
                    return '<div class="sync-mp">'
                        + '<div class="sync-mp-title">' + title + '</div>'
                        + '<div class="sync-mp-badges">' + body + '</div>'
                        + '</div>';
                }


                function catalogBadge(cat) {
                    if (!cat) return badge('товаров', 'muted', '—');
                    if (cat && cat.ok === false) return badge('каталог', 'error', cat.error);

                    var changes = [];
                    if (cat.added) changes.push('+' + cat.added);
                    if (cat.removed) changes.push('−' + cat.removed);
                    return badge('товаров', 'ok',
                        Number(cat.total || 0) + (changes.length ? ' (' + changes.join(', ') + ')' : ''));
                }

                function ozonBody(entry) {
                    return catalogBadge(entry.ozon_catalog) + renderEndpoint('остатки', entry.ozon);
                }

                function renderResults(report) {
                    var slugs = Object.keys(report || {});
                    if (!slugs.length) {
                        results.innerHTML = '';
                        return;
                    }
                    results.innerHTML = slugs.map(function (slug) {
                        var entry = report[slug] || {};
                        var name = slug.toUpperCase();

                        var wb = mpBlock('WB', entry.token,
                            catalogBadge(entry.wb_catalog)
                            + renderEndpoint('FBS', entry.fbs) + renderEndpoint('FBO', entry.fbo));
                        var ozon = mpBlock('OZON', entry.ozon_token, ozonBody(entry));
                        var yandex = mpBlock('ЯНДЕКС', entry.yandex_token,
                            catalogBadge(entry.yandex_catalog) + renderEndpoint('остатки', entry.yandex));

                        return '<div class="sync-card">'
                            + '<div class="sync-card-title">' + name + '</div>'
                            + wb + ozon + yandex
                            + '</div>';
                    }).join('');
                }

                function reportHasErrors(report) {
                    var fields = ['wb_catalog', 'fbs', 'fbo', 'ozon_catalog', 'ozon', 'yandex_catalog', 'yandex'];
                    return Object.keys(report || {}).some(function (slug) {
                        var entry = report[slug] || {};
                        return fields.some(function (field) {
                            return entry[field] && entry[field].ok === false;
                        });
                    });
                }

                function responseData(response) {
                    return response.text().then(function (body) {
                        var data = {};
                        if (body) {
                            try {
                                data = JSON.parse(body);
                            } catch (e) {
                                data = {};
                            }
                        }
                        if (!response.ok) {
                            throw new Error(data.error || data.detail || ('HTTP ' + response.status));
                        }
                        return data;
                    });
                }

                function setBusy(isBusy) {
                    btn.disabled = isBusy;
                    btn.setAttribute('aria-busy', isBusy ? 'true' : 'false');
                    panel.classList.toggle('is-syncing', isBusy);
                }

                function scheduleAutoHide() {
                    if (hideTimer) clearTimeout(hideTimer);
                    hideTimer = setTimeout(function () {
                        panel.classList.add('is-fading');
                        setTimeout(function () {
                            status.textContent = '';
                            results.innerHTML = '';
                            panel.classList.remove('is-fading');
                        }, 600);
                    }, AUTO_HIDE_MS);
                }

                btn.addEventListener('click', function () {
                    if (hideTimer) clearTimeout(hideTimer);
                    panel.classList.remove('is-fading');
                    setBusy(true);
                    status.textContent = 'Обновление остатков...';
                    results.innerHTML = '';
                    fetch('/admin/sync-stock', {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' }
                    })
                        .then(responseData)
                        .then(function (data) {
                            if (!data.report || typeof data.report !== 'object') {
                                throw new Error('Сервер не вернул отчёт о синхронизации');
                            }
                            status.textContent = reportHasErrors(data.report)
                                ? 'Синхронизация завершена с ошибками'
                                : 'Товары и остатки обновлены';
                            renderResults(data.report);
                            if (data.last_sync && lastSync) {
                                lastSync.textContent = data.last_sync;
                            }
                        })
                        .catch(function (err) {
                            status.textContent = 'Ошибка синхронизации: ' + (err.message || String(err));
                        })
                        .finally(function () {
                            setBusy(false);
                            scheduleAutoHide();
                        });
                });
            })();
        </script>
