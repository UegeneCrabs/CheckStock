        <section class="sales-dashboard"
                 data-sales-dashboard
                 data-default-from="$default_from"
                 data-default-to="$default_to">
            <div class="sales-head sales-head--compact">
                <div class="sales-period-badge">
                    <span class="sales-sync-dot" data-sales-sync-dot></span>
                    <div>
                        <span>Данные в базе</span>
                        <strong data-sales-sync-label>Проверяем...</strong>
                    </div>
                </div>
            </div>

            <form class="sales-filter-panel" data-sales-filters>
                <div class="sales-range-field">
                    <span class="sales-filter-caption">Период</span>
                    <div class="sales-date-range">
                        <label>
                            <span>С</span>
                            <input class="sales-date-input" type="date" name="date_from"
                                   value="$default_from" max="$date_max" required>
                        </label>
                        <span class="sales-date-separator" aria-hidden="true">→</span>
                        <label>
                            <span>По</span>
                            <input class="sales-date-input" type="date" name="date_to"
                                   value="$default_to" max="$date_max" required>
                        </label>
                    </div>
                    <div class="sales-presets" aria-label="Быстрый выбор периода">
                        <button type="button" data-sales-preset="7">7 дней</button>
                        <button type="button" class="is-active" data-sales-preset="30">30 дней</button>
                        <button type="button" data-sales-preset="90">90 дней</button>
                    </div>
                </div>
                <label class="sales-field">
                    <span>Магазин</span>
                    <select class="select-control" name="store">$sales_store_options</select>
                </label>
                <label class="sales-field">
                    <span>Маркетплейс</span>
                    <select class="select-control" name="marketplace">
$sales_marketplace_options
                    </select>
                </label>
                <div class="sales-filter-actions">
                    <button class="btn-primary sales-apply" type="submit" data-sales-apply>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.34-5.66"></path><path d="M20 4v7h-7"></path></svg>
                        <span>Обновить</span>
                    </button>
                    <a class="sales-export" href="#" data-sales-export title="Выгрузить заказы в XLSX">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>
                        <span>XLSX</span>
                    </a>
                </div>
                <p class="sales-filter-error" data-sales-error role="alert" hidden></p>
            </form>

            <div class="sales-chart-panel" data-sales-chart-panel>
                <div class="sales-chart-toolbar">
                    <div>
                        <h3>Динамика заказов</h3>
                        <p data-sales-chart-subtitle>Все магазины · Wildberries</p>
                    </div>
                    <div class="sales-legend" aria-label="Показатели графика">
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="orders" aria-pressed="true" title="Показать или скрыть заказы"><i class="line-total"></i>Заказы</button>
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="funnel_orders" aria-pressed="true" title="Показать или скрыть заказы из воронки" hidden><i class="line-funnel-orders"></i>Воронка</button>
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="fbo" aria-pressed="true" title="Показать или скрыть FBO"><i class="line-fbo"></i>FBO</button>
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="fbs" aria-pressed="true" title="Показать или скрыть FBS"><i class="line-fbs"></i>FBS</button>
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="cancellations" aria-pressed="true" title="Показать или скрыть отмены"><i class="line-cancellations"></i>Отмены</button>
                        <button class="sales-legend-toggle" type="button" data-sales-toggle="sales" aria-pressed="true" title="Показать или скрыть продажи"><i class="line-sales"></i>Продажи</button>
                    </div>
                </div>

                <div class="sales-chart-wrap">
                    <svg class="sales-chart" viewBox="0 0 1020 264" role="img"
                         aria-label="Динамика заказов, отмен и продаж по датам">
                        <defs>
                            <pattern id="salesDotGrid" x="72" y="32" width="24" height="24" patternUnits="userSpaceOnUse">
                                <circle cx="1" cy="1" r="1" fill="#dbe2ee"></circle>
                            </pattern>
                            <linearGradient id="salesChartFill" x1="0" x2="0" y1="0" y2="1">
                                <stop offset="0%" stop-color="#315efb" stop-opacity="0.13"></stop>
                                <stop offset="100%" stop-color="#315efb" stop-opacity="0.01"></stop>
                            </linearGradient>
                            <filter id="salesTooltipShadow" x="-30%" y="-30%" width="160%" height="180%">
                                <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#152032" flood-opacity="0.14"></feDropShadow>
                            </filter>
                        </defs>
                        <rect class="sales-chart-dots" x="72" y="32" width="916" height="176" fill="url(#salesDotGrid)"></rect>
                        <g class="sales-grid">
                            <line x1="72" y1="32" x2="988" y2="32"></line>
                            <line x1="72" y1="76" x2="988" y2="76"></line>
                            <line x1="72" y1="120" x2="988" y2="120"></line>
                            <line x1="72" y1="164" x2="988" y2="164"></line>
                            <line x1="72" y1="208" x2="988" y2="208"></line>
                        </g>
                        <g class="sales-y-labels">
                            <text x="18" y="36" data-y-label="4">—</text>
                            <text x="18" y="80" data-y-label="3">—</text>
                            <text x="18" y="124" data-y-label="2">—</text>
                            <text x="18" y="168" data-y-label="1">—</text>
                            <text x="18" y="212" data-y-label="0">0</text>
                        </g>
                        <path class="sales-area" data-sales-area d=""></path>
                        <path class="sales-line sales-line--total" data-sales-line="orders" d=""></path>
                        <path class="sales-line sales-line--funnel-orders" data-sales-line="funnel_orders" d=""></path>
                        <path class="sales-line sales-line--fbo" data-sales-line="fbo" d=""></path>
                        <path class="sales-line sales-line--fbs" data-sales-line="fbs" d=""></path>
                        <path class="sales-line sales-line--cancellations" data-sales-line="cancellations" d=""></path>
                        <path class="sales-line sales-line--sales" data-sales-line="sales" d=""></path>
                        <g class="sales-x-labels" data-sales-x-labels></g>
                        <g class="sales-chart-hover" data-sales-hover aria-hidden="true">
                            <line class="sales-reference-line" data-sales-reference-line x1="72" y1="32" x2="72" y2="208"></line>
                            <g class="sales-points" data-sales-points></g>
                            <g class="sales-chart-tooltip" data-sales-tooltip>
                                <rect width="320" height="194" rx="8"></rect>
                                <text class="sales-tooltip-period" x="14" y="23" data-sales-tooltip-period></text>
                                <text class="sales-tooltip-header" x="226" y="42">Сумма</text>
                                <text class="sales-tooltip-header" x="304" y="42">Шт.</text>
                                <line class="sales-tooltip-header-divider" x1="18" y1="49" x2="302" y2="49"></line>
                                <line class="sales-tooltip-column-divider" data-sales-tooltip-column-divider x1="240" y1="37" x2="240" y2="186"></line>
                                <g data-sales-tooltip-series="orders">
                                    <circle class="sales-tooltip-key sales-tooltip-key--total" cx="18" cy="60" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="64">Заказы</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="64" data-sales-tooltip-orders-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="64" data-sales-tooltip-orders-count></text>
                                </g>
                                <g data-sales-tooltip-series="funnel_orders">
                                    <circle class="sales-tooltip-key sales-tooltip-key--funnel-orders" cx="18" cy="83" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="87">Воронка</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="87" data-sales-tooltip-funnel_orders-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="87" data-sales-tooltip-funnel_orders-count></text>
                                </g>
                                <g data-sales-tooltip-series="fbo">
                                    <circle class="sales-tooltip-key sales-tooltip-key--fbo" cx="18" cy="106" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="110">FBO</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="110" data-sales-tooltip-fbo-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="110" data-sales-tooltip-fbo-count></text>
                                </g>
                                <g data-sales-tooltip-series="fbs">
                                    <circle class="sales-tooltip-key sales-tooltip-key--fbs" cx="18" cy="129" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="133">FBS</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="133" data-sales-tooltip-fbs-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="133" data-sales-tooltip-fbs-count></text>
                                </g>
                                <g data-sales-tooltip-series="cancellations">
                                    <circle class="sales-tooltip-key sales-tooltip-key--cancellations" cx="18" cy="152" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="156">Отмены</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="156" data-sales-tooltip-cancellations-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="156" data-sales-tooltip-cancellations-count></text>
                                </g>
                                <g data-sales-tooltip-series="sales">
                                    <circle class="sales-tooltip-key sales-tooltip-key--sales" cx="18" cy="175" r="4"></circle>
                                    <text class="sales-tooltip-row" x="29" y="179">Продажи</text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="226" y="179" data-sales-tooltip-sales-amount></text>
                                    <text class="sales-tooltip-row sales-tooltip-row--value" x="304" y="179" data-sales-tooltip-sales-count></text>
                                </g>
                            </g>
                        </g>
                        <rect class="sales-chart-hitarea" data-sales-chart-hitarea x="72" y="32" width="916" height="176"
                              tabindex="0" role="slider" aria-valuemin="1" aria-valuenow="1"
                              aria-label="Данные графика продаж"></rect>
                    </svg>
                    <div class="sales-chart-state" data-sales-chart-state aria-live="polite">
                        <span class="sales-loader"></span>
                        <strong>Загружаем данные</strong>
                    </div>
                </div>
            </div>

            <div class="sales-summary-grid">
                <article class="sales-kpi">
                    <span>ТО заказов без отмен</span>
                    <strong data-sales-kpi="orders">—</strong>
                    <small data-sales-kpi-note="orders">—</small>
                </article>
                <article class="sales-kpi sales-kpi--sales">
                    <span>Продажи</span>
                    <strong data-sales-kpi="sales">—</strong>
                    <small data-sales-kpi-note="sales">—</small>
                </article>
                <article class="sales-kpi sales-kpi--warning">
                    <span>Отмены</span>
                    <strong data-sales-kpi="cancellations">—</strong>
                    <small data-sales-kpi-note="cancellations">—</small>
                </article>
                <article class="sales-kpi">
                    <span>Заказы</span>
                    <strong data-sales-kpi="count">—</strong>
                    <small data-sales-kpi-note="count">—</small>
                </article>
            </div>

        </section>
