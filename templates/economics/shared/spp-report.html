<link rel="stylesheet" href="/static/common/wb-report.css?v=1" />
<link rel="stylesheet" href="/static/economics/shared/spp-report.css?v=21" />
<section class="spp-report" id="spp-report" aria-label="Отчёт по СПП">
    <header class="spp-report__heading">
        <h1>Отчёт по СПП</h1>
    </header>
    <div class="spp-report__top">
        <form class="spp-card spp-filters" id="spp-filters">
            <div class="spp-filters__header"><h2>Фильтры</h2></div>
            <div class="spp-period"><div class="spp-period__title">Период</div>
                <label>От<span class="spp-date-control"><input type="text" id="spp-date-from" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" autocomplete="off" required /><button type="button" class="spp-date-picker" data-date-target="spp-date-from" aria-label="Выбрать дату начала в календаре">▦</button><input type="date" class="spp-date-native" id="spp-date-from-native" tabindex="-1" aria-hidden="true" /></span></label>
                <label>До<span class="spp-date-control"><input type="text" id="spp-date-to" inputmode="numeric" placeholder="ДД.ММ.ГГГГ" autocomplete="off" required /><button type="button" class="spp-date-picker" data-date-target="spp-date-to" aria-label="Выбрать дату окончания в календаре">▦</button><input type="date" class="spp-date-native" id="spp-date-to-native" tabindex="-1" aria-hidden="true" /></span></label>
            </div>
            <div class="spp-filters__grid">
                <div class="spp-filter" data-spp-filter><label for="spp-store-search">Магазин</label><select name="store" id="spp-store"><option value="">Все</option></select></div>
                <div class="spp-filter" data-spp-filter id="spp-brand-label"><label for="spp-brand-search">Бренд</label><select name="brand" id="spp-brand"><option value="">Все</option></select></div>
                <div class="spp-filter" data-spp-filter id="spp-manager-label"><label for="spp-manager-search">Менеджер</label><select name="manager" id="spp-manager"><option value="">Все</option></select></div>
                <div class="spp-filter" data-spp-filter><label for="spp-subject-search">Предмет товара</label><select name="subject" id="spp-subject"><option value="">Все</option></select></div>
                <div class="spp-filter" data-spp-filter><label for="spp-article-search">Артикул</label><select name="article" id="spp-article"><option value="">Все</option></select></div>
                <label>Поиск по слову<input type="search" name="search" id="spp-search" placeholder="Введите слово" /></label>
            </div>
            <fieldset class="spp-direction">
                <legend>Изменение СПП</legend>
                <div class="spp-direction__options">
                    <label><input type="radio" name="direction" id="spp-direction-all" value="all" checked /><span>Все</span></label>
                    <label><input type="radio" name="direction" value="increase" /><span>Рост СПП</span></label>
                    <label><input type="radio" name="direction" value="decrease" /><span>Снижение СПП</span></label>
                </div>
            </fieldset>
            <div class="spp-filters__actions"><button type="submit" class="spp-button">Сформировать отчёт</button><button type="button" class="spp-button spp-button--reset" id="spp-reset">Сбросить фильтры</button></div>
        </form>
        <section class="spp-card spp-health" aria-labelledby="spp-health-title">
            <h2 id="spp-health-title">Изменение СПП</h2>
            <div class="spp-health__cards spp-change-cards">
                <div class="spp-health__metric spp-health__metric--good"><strong>Рост СПП</strong><b id="spp-increase-percent">—</b><span id="spp-increase-count">Нет данных</span></div>
                <div class="spp-health__metric spp-health__metric--bad"><strong>Снижение СПП</strong><b id="spp-decrease-percent">—</b><span id="spp-decrease-count">Нет данных</span></div>
                <div class="spp-health__metric spp-health__metric--unchanged"><strong>Без изменений</strong><b id="spp-unchanged-percent">—</b><span id="spp-unchanged-count">Нет данных</span></div>
            </div>
            <div class="spp-health__bar" id="spp-health-bar" aria-label="Доли товаров с ростом, снижением СПП и без изменений">
                <span class="spp-health__bar-good" id="spp-bar-increase"></span><span class="spp-health__bar-bad" id="spp-bar-decrease"></span><span class="spp-health__bar-unchanged" id="spp-bar-unchanged"></span>
            </div>
            <p class="spp-change-total">Товаров со сравнением: <strong id="spp-comparable">—</strong></p>
            <p class="spp-health__missing" id="spp-missing"></p>
        </section>
    </div>
    <section class="spp-card spp-table-card" aria-labelledby="spp-table-title">
        <h2 id="spp-table-title">Товары</h2>
        <p id="spp-period-note">Аналогичный период рассчитывается автоматически</p>
        <div class="spp-period-warning" id="spp-open-days-note" role="status" hidden></div>
        <div class="spp-message" id="spp-message" role="status"></div>
        <div class="spp-table-wrap"><table><colgroup>
            <col style="width:12%" /><col style="width:25%" /><col style="width:14%" />
            <col style="width:16%" /><col style="width:17%" /><col style="width:16%" />
        </colgroup><thead><tr>
            <th scope="col" aria-sort="none"><button type="button" data-spp-sort="article"><span class="spp-sort-label">Артикул</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-spp-sort="name"><span class="spp-sort-label">Название</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
            <th scope="col" aria-sort="descending"><button type="button" data-spp-sort="turnover"><span class="spp-sort-label">Торговый оборот</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-spp-sort="current_spp"><span class="spp-sort-label">СПП за выбранный период</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-spp-sort="previous_spp"><span class="spp-sort-label">СПП за предыдущий период</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
            <th scope="col" aria-sort="none"><button type="button" data-spp-sort="status"><span class="spp-sort-label">Статус</span><span class="spp-sort-indicator" aria-hidden="true"></span></button></th>
        </tr></thead><tbody id="spp-rows"></tbody></table></div>
        <nav class="spp-pagination" aria-label="Страницы отчёта">
            <button type="button" id="spp-prev">Назад</button><span id="spp-page-label"></span><button type="button" id="spp-next">Далее</button>
        </nav>
    </section>
</section>
<script type="application/json" id="spp-config">$spp_report_config</script>
<script src="/static/common/report-select.js?v=1"></script>
<script src="/static/common/report-daily.js?v=1"></script>
<script src="/static/economics/shared/spp-report.js?v=23"></script>
