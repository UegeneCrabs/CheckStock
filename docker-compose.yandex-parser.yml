# Run with: docker compose -f docker-compose.yml -f docker-compose.yandex-parser.yml up -d --build yandex-parser
services:
  yandex-parser:
    build:
      context: .
      dockerfile: deploy/yandex-parser/Dockerfile
    init: true
    restart: unless-stopped
    shm_size: 1gb
    security_opt:
      - seccomp=./deploy/yandex-parser/seccomp_profile.json
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHECKSTOCK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-checkstock}
      CHECKSTOCK_YANDEX_TOKENS_PATH: /app/secrets/yandex_tokens.json
      CHECKSTOCK_CAPTCHA_KEY_PATH: /app/secrets/captcha.json
    volumes:
      - ./secrets:/app/secrets:ro
      - yandex-parser-data:/app/data/yandex-storefront
    stop_grace_period: 45s
volumes:
  yandex-parser-data:
