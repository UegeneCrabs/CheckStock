services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkstock}
      POSTGRES_USER: ${POSTGRES_USER:-checkstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkstock} -d ${POSTGRES_DB:-checkstock}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    image: paketa-app
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CHECKSTOCK_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-checkstock}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-checkstock}
      CHECKSTOCK_DB_TIMEOUT_SECONDS: ${CHECKSTOCK_DB_TIMEOUT_SECONDS:-30}
      CHECKSTOCK_DB_BUSY_TIMEOUT_MS: ${CHECKSTOCK_DB_BUSY_TIMEOUT_MS:-30000}
      CHECKSTOCK_LOG_LEVEL: ${CHECKSTOCK_LOG_LEVEL:-INFO}
      CHECKSTOCK_SLOW_REQUEST_THRESHOLD_MS: ${CHECKSTOCK_SLOW_REQUEST_THRESHOLD_MS:-1000}
      CHECKSTOCK_BITRIX_WEBHOOK_URL: ${CHECKSTOCK_BITRIX_WEBHOOK_URL:-}
      CHECKSTOCK_BITRIX_DIALOG_ID: ${CHECKSTOCK_BITRIX_DIALOG_ID:-}
      CHECKSTOCK_BITRIX_ALERT_COOLDOWN_SECONDS: ${CHECKSTOCK_BITRIX_ALERT_COOLDOWN_SECONDS:-300}
      CHECKSTOCK_ADMIN_SEED_PATH: ${CHECKSTOCK_ADMIN_SEED_PATH:-/app/secrets/admin_seed.json}
      CHECKSTOCK_WB_TOKENS_PATH: ${CHECKSTOCK_WB_TOKENS_PATH:-/app/secrets/wb_tokens.json}
      CHECKSTOCK_OZON_TOKENS_PATH: ${CHECKSTOCK_OZON_TOKENS_PATH:-/app/secrets/ozon_tokens.json}
      CHECKSTOCK_YANDEX_TOKENS_PATH: ${CHECKSTOCK_YANDEX_TOKENS_PATH:-/app/secrets/yandex_tokens.json}
      CHECKSTOCK_GOOGLE_SERVICE_ACCOUNT_PATH: ${CHECKSTOCK_GOOGLE_SERVICE_ACCOUNT_PATH:-/app/secrets/google_service_account.json}
      CHECKSTOCK_DISABLE_BACKGROUND_SYNC: ${CHECKSTOCK_DISABLE_BACKGROUND_SYNC:-0}
      CHECKSTOCK_FUNNEL_ORDERS_SYNC_ENABLED: ${CHECKSTOCK_FUNNEL_ORDERS_SYNC_ENABLED:-1}
      CHECKSTOCK_TOKEN_CHECK_INTERVAL_SECONDS: ${CHECKSTOCK_TOKEN_CHECK_INTERVAL_SECONDS:-21600}
      CHECKSTOCK_SALES_SYNC_STARTUP_DELAY_SECONDS: ${CHECKSTOCK_SALES_SYNC_STARTUP_DELAY_SECONDS:-10}
      CHECKSTOCK_DECISION_SYNC_STARTUP_DELAY_SECONDS: ${CHECKSTOCK_DECISION_SYNC_STARTUP_DELAY_SECONDS:-20}
      CHECKSTOCK_RNP_SYNC_STARTUP_DELAY_SECONDS: ${CHECKSTOCK_RNP_SYNC_STARTUP_DELAY_SECONDS:-90}
      CHECKSTOCK_AUTO_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_AUTO_SYNC_INTERVAL_SECONDS:-1800}
      CHECKSTOCK_CATALOG_SYNC_HOUR: ${CHECKSTOCK_CATALOG_SYNC_HOUR:-3}
      CHECKSTOCK_UNIT_COST_SYNC_HOUR: ${CHECKSTOCK_UNIT_COST_SYNC_HOUR:-2}
      CHECKSTOCK_WB_REFERENCE_SYNC_HOUR: ${CHECKSTOCK_WB_REFERENCE_SYNC_HOUR:-4}
      CHECKSTOCK_WB_PRICE_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_WB_PRICE_SYNC_INTERVAL_SECONDS:-3600}
      CHECKSTOCK_SALES_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_SALES_SYNC_INTERVAL_SECONDS:-14400}
      CHECKSTOCK_WB_FUNNEL_ORDERS_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_WB_FUNNEL_ORDERS_SYNC_INTERVAL_SECONDS:-14400}
      CHECKSTOCK_DECISION_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_DECISION_SYNC_INTERVAL_SECONDS:-900}
      CHECKSTOCK_RNP_SYNC_INTERVAL_SECONDS: ${CHECKSTOCK_RNP_SYNC_INTERVAL_SECONDS:-14400}
      CHECKSTOCK_SESSION_TTL_DAYS: ${CHECKSTOCK_SESSION_TTL_DAYS:-14}
      CHECKSTOCK_SESSION_COOKIE_SECURE: ${CHECKSTOCK_SESSION_COOKIE_SECURE:-0}
      CHECKSTOCK_PBKDF2_ITERATIONS: ${CHECKSTOCK_PBKDF2_ITERATIONS:-200000}
      CHECKSTOCK_STOCK_WINDOW_DAYS: ${CHECKSTOCK_STOCK_WINDOW_DAYS:-30}
      CHECKSTOCK_STOCK_FROZEN_DAYS: ${CHECKSTOCK_STOCK_FROZEN_DAYS:-60}
      CHECKSTOCK_STOCK_EXCESS_DAYS: ${CHECKSTOCK_STOCK_EXCESS_DAYS:-90}
      CHECKSTOCK_STOCK_CACHE_TTL_SECONDS: ${CHECKSTOCK_STOCK_CACHE_TTL_SECONDS:-300}
      CHECKSTOCK_STOCK_DETAIL_PAGE_SIZE: ${CHECKSTOCK_STOCK_DETAIL_PAGE_SIZE:-100}
      CHECKSTOCK_WAREHOUSE_DISPLAY_LIMIT: ${CHECKSTOCK_WAREHOUSE_DISPLAY_LIMIT:-8}
      CHECKSTOCK_OPERATION_HISTORY_LIMIT: ${CHECKSTOCK_OPERATION_HISTORY_LIMIT:-500}
      CHECKSTOCK_FF_IMPORT_TIMEOUT_SECONDS: ${CHECKSTOCK_FF_IMPORT_TIMEOUT_SECONDS:-30}
      CHECKSTOCK_WB_REQUEST_TIMEOUT_SECONDS: ${CHECKSTOCK_WB_REQUEST_TIMEOUT_SECONDS:-30}
      CHECKSTOCK_OZON_REQUEST_TIMEOUT_SECONDS: ${CHECKSTOCK_OZON_REQUEST_TIMEOUT_SECONDS:-60}
      CHECKSTOCK_YANDEX_REQUEST_TIMEOUT_SECONDS: ${CHECKSTOCK_YANDEX_REQUEST_TIMEOUT_SECONDS:-60}
      CHECKSTOCK_WB_REQUEST_ATTEMPTS: ${CHECKSTOCK_WB_REQUEST_ATTEMPTS:-3}
      CHECKSTOCK_OZON_REQUEST_ATTEMPTS: ${CHECKSTOCK_OZON_REQUEST_ATTEMPTS:-5}
      CHECKSTOCK_YANDEX_REQUEST_ATTEMPTS: ${CHECKSTOCK_YANDEX_REQUEST_ATTEMPTS:-4}
      CHECKSTOCK_WB_RETRY_BACKOFF_SECONDS: ${CHECKSTOCK_WB_RETRY_BACKOFF_SECONDS:-5}
      CHECKSTOCK_OZON_RETRY_BACKOFF_SECONDS: ${CHECKSTOCK_OZON_RETRY_BACKOFF_SECONDS:-5}
      CHECKSTOCK_YANDEX_RETRY_BACKOFF_SECONDS: ${CHECKSTOCK_YANDEX_RETRY_BACKOFF_SECONDS:-5}
      CHECKSTOCK_WB_SALES_MAX_PAGES: ${CHECKSTOCK_WB_SALES_MAX_PAGES:-30}
      CHECKSTOCK_RNP_SYNC_COOLDOWN_MINUTES: ${CHECKSTOCK_RNP_SYNC_COOLDOWN_MINUTES:-55}
      CHECKSTOCK_RNP_REPORT_DOWNLOAD_TIMEOUT_SECONDS: ${CHECKSTOCK_RNP_REPORT_DOWNLOAD_TIMEOUT_SECONDS:-45}
      CHECKSTOCK_RNP_REPORT_POLL_ATTEMPTS: ${CHECKSTOCK_RNP_REPORT_POLL_ATTEMPTS:-18}
      CHECKSTOCK_RNP_REPORT_POLL_INTERVAL_SECONDS: ${CHECKSTOCK_RNP_REPORT_POLL_INTERVAL_SECONDS:-1}
    volumes:
      - ./secrets:/app/secrets:ro
    stop_grace_period: 60s

  watchdog:
    image: paketa-app
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_started
    environment:
      CHECKSTOCK_BITRIX_WEBHOOK_URL: ${CHECKSTOCK_BITRIX_WEBHOOK_URL:-}
      CHECKSTOCK_BITRIX_DIALOG_ID: ${CHECKSTOCK_BITRIX_DIALOG_ID:-}
      CHECKSTOCK_WATCHDOG_URL: ${CHECKSTOCK_WATCHDOG_URL:-http://app:8000/readyz}
      CHECKSTOCK_WATCHDOG_INTERVAL_SECONDS: ${CHECKSTOCK_WATCHDOG_INTERVAL_SECONDS:-60}
      CHECKSTOCK_WATCHDOG_TIMEOUT_SECONDS: ${CHECKSTOCK_WATCHDOG_TIMEOUT_SECONDS:-10}
      CHECKSTOCK_WATCHDOG_FAILURE_THRESHOLD: ${CHECKSTOCK_WATCHDOG_FAILURE_THRESHOLD:-3}
    command: ["python", "-m", "scripts.health_watchdog"]
    healthcheck:
      disable: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  postgres-data:
