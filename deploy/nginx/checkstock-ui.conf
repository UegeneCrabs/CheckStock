limit_req_zone $binary_remote_addr zone=checkstock_ui_login:10m rate=20r/m;

server {
    listen 80;
    server_name ui.rocketbm.ru;
    return 301 https://ui.rocketbm.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name ui.rocketbm.ru;
    ssl_certificate /etc/letsencrypt/live/ui.rocketbm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ui.rocketbm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;

    location = /api/auth/login {
        limit_req zone=checkstock_ui_login burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/auth/(session|logout)$ {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api {
        return 404;
    }

    location /api/ {
        return 404;
    }

    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8000/static/checkstock-ui/assets/;
    }

    location ~ \.[^/]+$ {
        return 404;
    }

    location / {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        rewrite ^ /static/checkstock-ui/index.html break;
        proxy_pass http://127.0.0.1:8000;
    }
}
